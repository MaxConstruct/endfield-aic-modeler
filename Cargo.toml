[workspace]
resolver = "3"
members = ["crates/aic-data", "crates/aic-core", "crates/aic-editor", "crates/aic-app-egui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
aic-data = { path = "crates/aic-data" }
aic-core = { path = "crates/aic-core" }
aic-editor = { path = "crates/aic-editor" }
