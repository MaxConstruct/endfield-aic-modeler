[workspace]
resolver = "3"
members = [
    "crates/aic-data",
    "crates/aic-core",
    "crates/aic-editor",
    "crates/aic-node-graph",
    "crates/aic-app",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"
publish = false
# The app's status bar shows these two and the license (crates/aic-app/src/editor.rs); this is
# their only copy.
authors = ["MaxConstruct"]
repository = "https://github.com/MaxConstruct/endfield-aic-modeler"

[workspace.dependencies]
aic-data = { path = "crates/aic-data" }
aic-core = { path = "crates/aic-core" }
aic-editor = { path = "crates/aic-editor" }
aic-node-graph = { path = "crates/aic-node-graph" }

# Release with line tables, so a profiler can name the lines a frame spends its time on:
# `cargo build --profile profiling -p aic-app --example perf_app`, then profile
# `target/profiling/examples/perf_app` (see docs/PLAN.md, M7).
[profile.profiling]
inherits = "release"
debug = "line-tables-only"

# The builds players download (scripts/package-*): the program optimized as one unit, about 6
# minutes a build on the Windows PC, so kept out of `release`. A panic aborts at once: nothing in
# the app catches one, and the message is printed the same way first. Not named `dist`: that is
# target/dist/, where the packaging scripts write; `package` is a name Cargo keeps for itself
# (docs/PLAN.md, M7 and M12).
[profile.packaged]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"

# The PNG crates always optimized, in build scripts too: aic-app's build script packs the icon
# sheet at the best compression (docs/PLAN.md, M13 step 3), which takes about 34 s with them
# unoptimized and 21 s with them optimized; debug tests decode the sheet. Build scripts are not
# optimized in any profile otherwise, `release` included.
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
[profile.dev.package.simd-adler32]
opt-level = 3
[profile.release.package.png]
opt-level = 3
[profile.release.package.fdeflate]
opt-level = 3
[profile.release.package.miniz_oxide]
opt-level = 3
[profile.release.package.image]
opt-level = 3
[profile.release.package.crc32fast]
opt-level = 3
[profile.release.package.simd-adler32]
opt-level = 3

# The AVIF encoder likewise, for the web build's sheet (`avif-sheets`, PLAN.md M13 step 5): it takes
# about 13 s on the sheet optimized. Only a web build compiles these.
[profile.dev.package.rav1e]
opt-level = 3
[profile.dev.package.ravif]
opt-level = 3
[profile.release.package.rav1e]
opt-level = 3
[profile.release.package.ravif]
opt-level = 3
