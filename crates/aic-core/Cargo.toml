[package]
name = "aic-core"
description = "Graph model, validation and solver. No UI dependency."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
aic-data.workspace = true
good_lp = { version = "1.15", default-features = false, features = ["microlp"] }
# The solver good_lp already uses (same version as in Cargo.lock; no new crate). Named here only
# for its branch-and-bound node limit, which good_lp doesn't expose (ADR 0013).
microlp = "=0.6.0"
indexmap = "2.14.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"
slotmap = "1.1.1"
thiserror = "2.0.21"
