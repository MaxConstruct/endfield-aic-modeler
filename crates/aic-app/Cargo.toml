[package]
name = "aic-app"
description = "Desktop UI for AIC Modeler."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
aic-core.workspace = true
aic-data.workspace = true
aic-editor.workspace = true
eframe = { version = "0.36", features = ["persistence"] }
egui-snarl = "0.12"
egui_dock = { version = "0.21.1", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["png"] }
indexmap = "2"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
web-time = "1.1"

# The web build (M9): eframe's web runner, fetching data/ from the site, and file downloads.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Blob",
    "BlobPropertyBag",
    "Document",
    "Element",
    "HtmlAnchorElement",
    "HtmlCanvasElement",
    "Response",
    "Url",
    "Window",
] }

# The allocator on the desktop: Windows' own heap took about a third of each frame (PLAN.md, M7).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
mimalloc = "0.1.52"

# Hides the main window from the screen while eframe builds it, so a restored maximized window
# doesn't flash up blank before the first frame (src/startup_cloak.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
aic-editor = { workspace = true, features = ["testing"] }
egui_kittest = { version = "0.36", features = ["wgpu", "snapshot", "eframe"] }
