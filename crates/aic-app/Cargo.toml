[package]
name = "aic-app"
description = "Desktop UI for AIC Modeler."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
aic-core.workspace = true
aic-data.workspace = true
aic-editor.workspace = true
# The node canvas (ADR 0011).
aic-node-graph.workspace = true
eframe = { version = "0.36", features = ["persistence"] }
# Scales an egui style: the canvas lays its cards out at its largest zoom (canvas.rs).
egui-scale = "0.6"
egui_dock = { version = "0.21.1", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["png"] }
indexmap = "2"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
web-time = "1.1"

# The web build (M9): eframe's web runner, fetching data/ from the site, and file downloads.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Blob",
    "BlobPropertyBag",
    "Document",
    "Element",
    "HtmlAnchorElement",
    "HtmlCanvasElement",
    "Url",
    "Window",
] }

# The allocator on the desktop: Windows' own heap took about a third of each frame (PLAN.md, M7).
# dhat counts allocations in its place, only with the `dhat-heap` feature (PLAN.md, M12).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
mimalloc = "0.1.52"
dhat = { version = "0.3.3", optional = true }

[features]
# The web build's icon sheet as AVIF (build.rs, PLAN.md M13 step 5): `index.html` asks Trunk for
# it, and only a wasm32 build encodes with it. A desktop build leaves it off and never compiles the
# encoder.
avif-sheets = ["dep:ravif"]
# Swaps mimalloc for dhat's counting allocator: `perf_app` then prints allocations per frame and
# writes dhat's file of allocation sites. Slow; never in a build for players. Does nothing on wasm.
dhat-heap = ["dep:dhat"]

# Hides the main window from the screen while eframe builds it, so a restored maximized window
# doesn't flash up blank before the first frame (src/startup_cloak.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

# build.rs puts the app icon (assets/app-icon/AppIcon.ico) into the Windows .exe, so Explorer, the
# taskbar's pinned button and the Start menu show it.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

# build.rs packs the icons some data version uses into one sheet (PLAN.md, M13): aic-data says
# which IDs the data uses, image decodes the PNGs and writes the sheet.
[build-dependencies]
aic-data.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
# The AVIF encoder for the web sheet, with the `avif-sheets` feature. Without `asm`, which would
# need nasm: the workspace's Cargo.toml optimizes rav1e in build scripts instead.
ravif = { version = "0.13", default-features = false, features = ["threading"], optional = true }

[dev-dependencies]
aic-editor = { workspace = true, features = ["testing"] }
egui_kittest = { version = "0.36", features = ["wgpu", "snapshot", "eframe"] }
