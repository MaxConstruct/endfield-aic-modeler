[package]
name = "aic-app"
description = "Desktop UI for AIC Modeler."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
aic-core.workspace = true
aic-data.workspace = true
eframe = { version = "0.36", features = ["persistence"] }
egui-snarl = "0.12"
fluent-bundle = "0.16.0"
image = { version = "0.25", default-features = false, features = ["png"] }
indexmap = "2"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
unic-langid = "0.9.6"
web-time = "1.1"

# The web build (M9): eframe's web runner, fetching data/ from the site, and file downloads.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Blob",
    "BlobPropertyBag",
    "Document",
    "Element",
    "HtmlAnchorElement",
    "HtmlCanvasElement",
    "Response",
    "Url",
    "Window",
] }

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["wgpu", "snapshot", "eframe"] }
