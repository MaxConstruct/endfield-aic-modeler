<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AIC Modeler: factory planner for Arknights: Endfield</title>
    <meta name="description" content="Graph-first factory planner for Arknights: Endfield.">
    <!-- theme::color::CANVAS, like the page's background, for the browser's own bar. -->
    <meta name="theme-color" content="#111214">
    <!-- The app, built for wasm32 by Trunk. Trunk.toml's pattern_script starts it, with the
         .wasm this page fetches (PLAN.md, M13 step 4). `avif-sheets` has build.rs write the
         icon sheet as AVIF (step 5); scripts/web-assets.sh builds with the same features. -->
    <link data-trunk rel="rust" data-bin="aic-app" data-cargo-features="avif-sheets" data-wasm-opt="2" />
    <!-- The app icon, as the Windows plate's SVG: sharp at any tab size. Trunk copies both icons
         under hashed names, so they can be cached for good like the other files. The .ico
         (16, 32 and 48 px, from assets/web/) is for browsers and crawlers that can't use the SVG;
         it comes first, with a size, so a browser that can use the SVG picks the SVG. Trunk
         drops `sizes` and `type` from its icon links; scripts/web-assets.sh puts them back. -->
    <link data-trunk rel="icon" href="assets/web/favicon.ico" sizes="48x48">
    <link data-trunk rel="icon" type="image/svg+xml" href="assets/app-icon/AppIcon-Windows.svg">
    <!-- The home-screen icon for iOS (180 px). Trunk has no pipeline for it, so
         scripts/web-assets.sh copies it under a hashed name and writes that name in. -->
    <link rel="apple-touch-icon" href="">
    <!-- The link preview, for chat apps and social sites. Their crawlers need absolute URLs, and
         this page doesn't know its address: scripts/web-assets.sh writes in AIC_SITE_URL and the
         thumbnail's hashed name (assets/web/og-image.png, 1200 by 630 px), or, without AIC_SITE_URL,
         takes out the tags that need it and asks for the small card. -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="AIC Modeler">
    <meta property="og:title" content="AIC Modeler">
    <meta property="og:description" content="Graph-first factory planner for Arknights: Endfield.">
    <meta property="og:url" content="">
    <meta property="og:image" content="">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="AIC Modeler app icon beside the name and subtitle on a dark grid">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="AIC Modeler">
    <meta name="twitter:description" content="Graph-first factory planner for Arknights: Endfield.">
    <meta name="twitter:image" content="">
    <meta name="twitter:image:alt" content="AIC Modeler app icon beside the name and subtitle on a dark grid">
    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            /* theme::color::CANVAS, so the page doesn't flash white before the app draws. */
            background: #111214;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        /* The loading page: a percentage and a bar under it, and no words, since the words are
           in the .wasm with Fluent (ADR 0012). Colours are the app's: theme::color::TEXT_MUTED,
           CONTROL, ACCENT and NEGATIVE. */
        #loading {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: #111214;
            color: #a0a3ab;
            font: 500 15px/1 system-ui, sans-serif;
            font-variant-numeric: tabular-nums;
        }
        #loading-bar {
            width: 240px;
            height: 4px;
            border-radius: 2px;
            background: #26282d;
            overflow: hidden;
        }
        #loading-fill {
            width: 0;
            height: 100%;
            background: #6e9bff;
        }
        #loading.failed #loading-fill {
            background: #ef6461;
        }
    </style>
</head>
<body>
    <canvas id="aic-modeler"></canvas>
    <!-- scripts/web-assets.sh writes the files in: the .wasm's name and size, and each icon
         sheet's. -->
    <div id="loading" data-wasm="" data-sheets="">
        <div id="loading-text">0%</div>
        <div id="loading-bar"><div id="loading-fill"></div></div>
    </div>
    <script>
        // One count from 0 to 100% over every byte the editor needs: the .wasm and the icon
        // sheets (AVIF), all fetched from here at once. It stops at 99% until this page has
        // decoded the sheets and the app has drawn the editor, which then takes this page away.
        // A file that fails shows its name and HTTP status (PLAN.md, M13 steps 4 and 5).
        (() => {
            const page = document.getElementById("loading");
            const text = document.getElementById("loading-text");
            const fill = document.getElementById("loading-fill");
            const file = (entry) => {
                const [name, size] = entry.split(":");
                return { name, size: Number(size), bytes: 0 };
            };
            const wasm = file(page.dataset.wasm);
            const sheets = page.dataset.sheets.split(" ").filter(Boolean).map(file);
            const files = [wasm, ...sheets];
            const total = files.reduce((sum, f) => sum + f.size, 0);
            let shown = 0;
            let failed = false;
            // Each percentage shown and when, for measuring a load.
            const steps = [];

            const show = () => {
                if (failed || total === 0) return;
                const done = files.reduce((sum, f) => sum + Math.min(f.bytes, f.size), 0);
                const percent = Math.min(99, Math.floor((done / total) * 100));
                if (percent > shown) {
                    shown = percent;
                    steps.push([Math.round(performance.now()), percent]);
                    text.textContent = percent + "%";
                    fill.style.width = percent + "%";
                }
            };

            const fail = (name, status) => {
                if (failed) return;
                failed = true;
                page.classList.add("failed");
                text.textContent = status ? name + " " + status : name;
            };

            // A file that failed where no response says why (an import, a compile): ask the
            // server for its status.
            const failAsking = async (name) => {
                const status = await fetch(name, { method: "HEAD", cache: "no-store" })
                    .then((response) => response.status, () => 0);
                fail(name, status);
            };

            // A response whose body counts its bytes into `f` as it is read.
            const counted = async (f) => {
                let response;
                try {
                    response = await fetch(f.name);
                } catch (error) {
                    fail(f.name);
                    throw error;
                }
                if (!response.ok) {
                    fail(f.name, response.status);
                    throw new Error(f.name + " " + response.status);
                }
                // Read eagerly, as Trunk's own loader does, so the download never waits on
                // whoever reads the body.
                const reader = response.body.getReader();
                const body = new ReadableStream({
                    async start(controller) {
                        try {
                            for (;;) {
                                const { done, value } = await reader.read();
                                if (done) break;
                                f.bytes += value.byteLength;
                                show();
                                controller.enqueue(value);
                            }
                            controller.close();
                        } catch (error) {
                            fail(f.name);
                            controller.error(error);
                        }
                    },
                });
                return new Response(body, { status: response.status, headers: response.headers });
            };

            // A sheet's pixels: the browser decodes the AVIF (the desktop's PNG would be four
            // times the bytes, and an AV1 decoder in the .wasm more than it saves), and a canvas
            // hands over its RGBA, unmultiplied, for the app (src/web.rs). A sheet that doesn't
            // decode shows its name.
            const decoded = async (f) => {
                const blob = await (await counted(f)).blob();
                try {
                    const bitmap = await createImageBitmap(blob, {
                        premultiplyAlpha: "none",
                        colorSpaceConversion: "none",
                    });
                    const { width, height } = bitmap;
                    const canvas = new OffscreenCanvas(width, height);
                    const context = canvas.getContext("2d", { willReadFrequently: true });
                    context.drawImage(bitmap, 0, 0);
                    bitmap.close();
                    const pixels = context.getImageData(0, 0, width, height).data;
                    return { width, height, rgba: new Uint8Array(pixels.buffer) };
                } catch (error) {
                    fail(f.name);
                    throw error;
                }
            };

            if (!wasm.name || sheets.length === 0) {
                // Built without scripts/web-assets.sh: the page doesn't know its files.
                fail(location.pathname.split("/").pop() || "index.html");
            }
            window.aicLoading = {
                // The .wasm as a response, for wasm-bindgen to compile as it arrives.
                wasm: counted(wasm),
                // The app awaits these before it starts (src/web.rs).
                sheets: Promise.all(sheets.map(decoded)),
                failed: failAsking,
                steps,
            };
            window.aicLoading.wasm.catch(() => {});
            window.aicLoading.sheets.catch(() => {});
        })();
    </script>
</body>
</html>
