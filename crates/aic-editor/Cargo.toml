[package]
name = "aic-editor"
description = "App logic shared by the UIs. No GUI dependency."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Test fixtures (`aic_editor::testing`) for the UIs' own tests.
testing = []

[dependencies]
aic-core.workspace = true
aic-data.workspace = true
fluent-bundle = "0.16.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
unic-langid = "0.9.6"
web-time = "1.1"
